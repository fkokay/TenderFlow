<!DOCTYPE html>
<html lang="tr">
<!-- begin::Head -->

<head>
    <meta charset="utf-8" />
    <title>Oturum Aç</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="shortcut icon" href="assets/media/logos/favicon.ico" />

    <script src="https://ajax.googleapis.com/ajax/libs/webfont/1.6.16/webfont.js"></script>
    <script>
        WebFont.load({
            google: { "families": ["Poppins:300,400,500,600,700", "Roboto:300,400,500,600,700"] },
            active: function () {
                sessionStorage.fonts = true;
            }
        });
    </script>
    <link href="https://usubaliev.com/eflow-layout-user-menu/assets/css/custom-login.css" rel="stylesheet" type="text/css" />
    <link href="https://usubaliev.com/eflow-layout-user-menu/assets/vendors/base/vendors.bundle.css" rel="stylesheet" type="text/css" />
    <link href="https://usubaliev.com/eflow-layout-user-menu/assets/demo/demo7/base/style.bundle.css" rel="stylesheet" type="text/css" />
</head>
<!-- end::Head -->

<!-- begin::Body -->

<body class="kt-header--fixed kt-header-mobile--fixed kt-subheader--fixed kt-subheader--enabled kt-subheader--solid kt-aside--enabled kt-aside--fixed kt-page--loading">

    <!-- begin:: Page -->
    <div class="kt-grid kt-grid--ver kt-grid--root">
        <div class="kt-grid kt-grid--hor kt-grid--root  kt-login kt-login--v6 kt-login--signin" id="kt_login">
            <div class="kt-grid__item kt-grid__item--fluid kt-grid kt-grid--desktop kt-grid--ver-desktop kt-grid--hor-tablet-and-mobile">
                <div class="kt-grid__item  kt-grid__item--order-tablet-and-mobile-2  kt-grid kt-grid--hor kt-login__aside">
                    <div class="kt-login__wrapper">
                        <div class="kt-login__logo">
                            <a href="/">
                                <img src="https://usubaliev.com/eflow-layout-user-menu/assets/media/company-logos/logo-eflow3.svg">
                            </a>
                        </div>
                        <div class="kt-login__form-switcher">
                            <!-- begin::login with user & password -->
                            <div class="kt-login__container login-with__email is-active">
                                <div class="kt-login__body">
                                    <form action="">
                                        <div class="ef3-login-options-container">
                                            <div class="ef3-options-wrap">
                                                <div class="ef3-input-wrap">
                                                    <div class="ef3-inputs-group">
                                                        <!-- add class 'input-error' to 'ef3-login-input' in case of error -->
                                                        <input type="text" id="userName" class="ef3-login-input" maxlength="" placeholder="" autocomplete="off" />
                                                        <label for="userName">Kullanıcı adı</label>
                                                    </div>
                                                    <div class="ef3-inputs-group">
                                                        <input type="password" id="userPassword" class="ef3-login-input " placeholder="" autocomplete="off" />
                                                        <label for="userPassword">Şifre</label>
                                                        <!-- <span class="ef3-login-input-error">Yanlış kullanıcı adı ve/veya şifre</span> -->
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="d-flex position-relative remember-me">
                                                <label class="kt-checkbox kt-checkbox--bold kt-checkbox--brand">
                                                    <input type="checkbox"> Oturumu açık tut
                                                    <span></span>
                                                </label>
                                                <a href="#" id="forgotPasswordBtn" class="forgot-password" title="Şifremi unuttum">
                                                    Şifremi unuttum!
                                                    <i class="fa fa-arrow-right"></i>
                                                </a>
                                            </div>
                                            <div class="kt-login__actions">
                                                <button id="loginSubmitBtn" class="btn btn-brand w-100">Oturum Aç</button>
                                            </div>
                                            <div class="other-login-options">
                                                <div class="login-options_separator">
                                                    <span>Diğer seçenekler:</span>
                                                </div>
                                                <a href="" id="loginWithGoogle" class="btn btn-outline-secondary login-option login-google">
                                                    <img src="assets/media/company-logos/login-google.svg" alt="">
                                                    <span class="d-flex">Google</span>
                                                </a>
                                                <a href="" id="loginWithOutlook" class="btn btn-outline-secondary login-option login-outlook">
                                                    <img src="assets/media/company-logos/login-office365.svg" alt="">
                                                    <span class="d-flex">Office 365</span>
                                                </a>
                                                <a href="" id="loginWithSSO" class="btn btn-outline-secondary login-option login-sso">
                                                    <img src="assets/media/company-logos/login-sso.svg" alt="">
                                                    <span class="d-flex">Tek oturum açma (SSO)</span>
                                                </a>
                                            </div>
                                        </div>
                                    </form>
                                </div>
                            </div>
                            <!-- end::login with user & password -->

                            <!-- begin::password-reminder -->
                            <div class="kt-login__container password-reminder">
                                <div class="kt-login__body">
                                    <div class="btn-go-back-wrap">
                                        <button class="btn btn-go-back circle" title="Geri">
                                            <i class="fa fa-arrow-left"></i>
                                        </button>
                                    </div>
                                    <form action="">
                                        <div class="ef3-login-options-container">
                                            <div class="ef3-options-wrap">
                                                <div class="ef3-input-wrap">
                                                    <div class="ef3-inputs-group">
                                                        <input type="text" id="companyNumber" class="ef3-login-input" maxlength="" placeholder="" autocomplete="off" />
                                                        <label for="companyNumber">Firma No</label>
                                                    </div>
                                                    <div class="ef3-inputs-group">
                                                        <input type="text" id="userName2" class="ef3-login-input " placeholder="" autocomplete="off" />
                                                        <label for="userName2">Kullanıcı adı</label>
                                                    </div>
                                                    <div class="ef3-inputs-group-recaptcha">
                                                        <div class="recaptcha">
                                                            <img src="assets/media/misc/recaptcha.jpg" alt="">
                                                        </div>
                                                    </div>
                                                    <div class="ef3-inputs-group">
                                                        <input type="text" id="reCaptcha" class="ef3-login-input input-error" placeholder="" autocomplete="off" />
                                                        <label for="reCaptcha">Güvenlik Kodu</label>
                                                        <span class="ef3-login-input-error">Yanlış güvenlik kodu</span>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="kt-login__actions mb-2">
                                                <button id="requestNewPassword" class="btn btn-brand w-100">Gönder</button>
                                                <button class="btn btn-link btn-go-back">İptal</button>
                                            </div>
                                            <p class="login-option-desc-text">
                                                Girdiğiniz bilgiler doğru ise parolanız e-posta adresinize gönderilecektir.
                                            </p>
                                        </div>
                                    </form>
                                </div>
                            </div>
                            <!-- end::password-reminder -->


                            <!-- begin:: SSO form -->
                            <div class="kt-login__container sso-login">
                                <div class="kt-login__body">
                                    <div class="btn-go-back-wrap">
                                        <button class="btn btn-go-back circle" title="Geri">
                                            <i class="fa fa-arrow-left"></i>
                                        </button>
                                        <div class="circular-counter-wrap">
                                            <svg class="circular-counter__svg" viewBox="0 0 48 48" aria-hidden="true">
                                                <circle class="circular-counter__track" cx="24" cy="24" r="20"></circle>
                                                <circle class="circular-counter__progress" cx="24" cy="24" r="20"></circle>
                                            </svg>
                                            <span class="circular-counter__value" data-countdown-value>120</span>
                                        </div>
                                    </div>
                                    <form action="">
                                        <div class="ef3-login-options-container">
                                            <p class="login-option-desc-text">
                                                <span class="bold">*** *** ** 56</span>
                                                <span>telefon numarasına gönderilen rakamları aşağıdaki boşluklara girin.</span>
                                            </p>
                                            <div class="ef3-options-wrap sso-digit-wrapper form-group">
                                                <input type="text" maxlength="1" id="ssoDigit01" class="form-control">
                                                <input type="text" maxlength="1" id="ssoDigit02" class="form-control">
                                                <input type="text" maxlength="1" id="ssoDigit03" class="form-control">
                                                <input type="text" maxlength="1" id="ssoDigit04" class="form-control">
                                                <input type="text" maxlength="1" id="ssoDigit05" class="form-control">
                                                <input type="text" maxlength="1" id="ssoDigit06" class="form-control">
                                            </div>
                                            <!-- hidden input for validation -->
                                            <input type="hidden" id="ssoCodeValue" name="ssoCode" value="">
                                            <div class="kt-login__actions">
                                                <button id="submitSSO" class="btn btn-brand w-100" disabled>Oturum Aç</button>
                                                <button class="btn btn-link btn-go-back">İptal</button>
                                            </div>
                                        </div>
                                    </form>
                                </div>
                            </div>
                            <!-- end::SSO form -->
                        </div>

                        <div class="kt-login__vendor">
                            <a href="https://netoloji.com" target="_blank">
                                <img src="https://usubaliev.com/eflow-layout-user-menu/assets/media/logos/netoloji-logo-150px.png">
                            </a>
                        </div>
                    </div>
                </div>

                <div class="kt-grid__item kt-grid__item--fluid kt-grid__item--center kt-grid kt-grid--ver position-relative kt-login__content">

                    <button class="btn btn-sm pausePlayLoginAnimation" id="pausePlayLoginAnimation" title="Play">
                        <i class="fa fa-play"></i> Play
                    </button>

                    <div class="login-animation-container">
                        <lottie-player src="file:///C:/Users/TARIKPC/Desktop/E-Flow3-Login-Pack/assets/media/ef3-workflow-animation.json" class="login-lottie-player" background="transparent" loop></lottie-player>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- end:: Page -->

    <!-- begin::Global Config (global config for global JS sciprts) -->
    <script>
        var KTAppOptions = {
            "colors": {
                "state": {
                    "brand": "#22b9ff",
                    "light": "#ffffff",
                    "dark": "#282a3c",
                    "primary": "#4c81d1",
                    "success": "#0abb87",
                    "info": "#2786fb",
                    "warning": "#ffb822",
                    "danger": "#fd397a"
                },
                "base": {
                    "label": ["#c5cbe3", "#a1a8c3", "#3d4465", "#3e4466"],
                    "shape": ["#f0f3ff", "#d9dffa", "#afb4d4", "#646c9a"]
                }
            }
        };
    </script>

    <script src="https://usubaliev.com/eflow-layout-user-menu/assets/vendors/base/vendors.bundle.js" type="text/javascript"></script>
    <script src="https://usubaliev.com/eflow-layout-user-menu/assets/demo/demo7/base/scripts.bundle.js" type="text/javascript"></script>
    <!-- <script src="assets/app/custom/login/login-general.js" type="text/javascript"></script> -->
    <!-- Skip KTLayout aside setup -->
    <script>
        if (window.KTLayout && window.KTUtil) {
            var __originalInitAside = KTLayout.initAside;
            var __originalOnAsideToggle = KTLayout.onAsideToggle;
            KTLayout.initAside = function () {
                if (KTUtil.get('kt_aside') && KTUtil.get('kt_aside_menu')) {
                    return __originalInitAside.apply(this, arguments);
                }
            };
            KTLayout.onAsideToggle = function () {
                var toggler = KTLayout.getAsideToggler ? KTLayout.getAsideToggler() : null;
                if (toggler && typeof toggler.element !== 'undefined') {
                    return __originalOnAsideToggle.apply(this, arguments);
                }
            };
        }
    </script>
    <script src="https://usubaliev.com/eflow-layout-user-menu/assets/vendors/lottie-player.js"></script>
    <script src="https://usubaliev.com/eflow-layout-user-menu/assets/app/custom/ef3-login.js"></script>
</body>

</html>
